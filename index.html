<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <title>MaxIncome - Nuvem Autónoma 24/7</title>
    <style>
        body { background-color: #131722; color: #d1d4dc; font-family: Arial, sans-serif; text-align: center; margin: 0; padding: 20px; }
        h1 { color: #f0b90b; }
        .card { background: #1e222d; padding: 20px; margin: 15px auto; width: 60%; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        select { padding: 10px; font-size: 16px; border-radius: 5px; border: none; background: #f0b90b; color: #000; font-weight: bold; cursor: pointer; }
        .status-box { color: #0ecb81; font-weight: bold; margin-bottom: 20px; font-size: 16px; }
        .trade-log { background: #11141d; padding: 15px; border-radius: 5px; margin-top: 10px; font-family: monospace; color: #0ecb81; text-align: left; max-height: 180px; overflow-y: auto; font-size: 13px; line-height: 1.5; }
    </style>
</head>
<body>

    <h1>MaxIncome - Nuvem Autónoma 24/7</h1>
    <p>Sistema de Grid Trading 100% Autónomo em Tempo Real</p>

    <div class="card">
        <label for="symbolSelect"><strong>Ativo em Operação Autónoma:</strong> </label>
        <select id="symbolSelect">
            <option value="XRPUSDT" selected>XRP (XRP/USDT)</option>
            <option value="DOGEUSDT">DOGE (DOGE/USDT)</option>
            <option value="ADAUSDT">ADA (ADA/USDT)</option>
        </select>
    </div>

    <div class="status-box">🟢 Robô a operar sozinho na nuvem (24 horas por dia)</div>

    <div class="card">
        <h3>Saldo Disponível na Bybit</h3>
        <h2 id="saldoUsdt" style="color: #0ecb81;">$ 9.01 USDT</h2>
    </div>

    <div class="card">
        <h3>Cotação de Mercado em Tempo Real (<span id="currentSymbol">XRPUSDT</span>)</h3>
        <h2 id="currentPrice" style="color: #f0b90b;">$ --</h2>
    </div>

    <div class="card">
        <h3>Registo de Atividade Autónoma do Robô</h3>
        <div id="tradeLog" class="trade-log">A ligar ao motor autónomo...</div>
    </div>

    <script>
        async function atualizarPainel() {
            const symbol = document.getElementById('symbolSelect').value;
            document.getElementById('currentSymbol').innerText = symbol;

            try {
                // Preço em tempo real via Binance Public API (sem bloqueio de rede)
                const res = await fetch(`https://api.binance.com/api/v3/ticker/price?symbol=${symbol}`);
                const data = await res.json();
                if (data && data.price) {
                    document.getElementById('currentPrice').innerText = `$ ${parseFloat(data.price).toFixed(4)}`;
                }

                // Saldo na Bybit
                const accRes = await fetch('/binance-account');
                const accData = await accRes.json();
                if (accData && accData.balances && accData.balances[0]) {
                    document.getElementById('saldoUsdt').innerText = `$ ${accData.balances[0].free} USDT`;
                }

                // Registos autónomos gerados pelo servidor na nuvem
                const logRes = await fetch('/logs');
                const logData = await logRes.json();
                if (logData && logData.logs) {
                    document.getElementById('tradeLog').innerText = logData.logs.join('\n');
                }
            } catch (e) {
                console.error("Erro na atualização automática:", e);
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            atualizarPainel();
            setInterval(atualizarPainel, 3000); // Atualiza a tela a cada 3 segundos
        });
    </script>

</body>
</html>
