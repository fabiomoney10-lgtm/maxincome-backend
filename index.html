<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <title>MaxIncome - Nuvem Autónoma 24/7</title>
    <style>
        body { background-color: #131722; color: #d1d4dc; font-family: Arial, sans-serif; text-align: center; margin: 0; padding: 20px; }
        h1 { color: #f0b90b; }
        .card { background: #1e222d; padding: 20px; margin: 15px auto; width: 60%; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        select { padding: 10px; font-size: 16px; border-radius: 5px; border: none; background: #f0b90b; color: #000; font-weight: bold; }
        .status-box { color: #0ecb81; font-weight: bold; margin-bottom: 20px; font-size: 16px; }
        .trade-log { background: #11141d; padding: 15px; border-radius: 5px; margin-top: 10px; font-family: monospace; color: #0ecb81; text-align: left; max-height: 180px; overflow-y: auto; font-size: 13px; line-height: 1.5; }
    </style>
</head>
<body>

    <h1>MaxIncome - Nuvem Autónoma 24/7</h1>
    <p>Sistema de Grid Trading 100% Autónomo em Tempo Real</p>

    <div class="card">
        <label><strong>Ativo em Operação:</strong> XRP (XRP/USDT)</label>
    </div>

    <div class="status-box">🟢 Sistema Conectado e Operacional</div>

    <div class="card">
        <h3>Saldo Disponível na Bybit</h3>
        <h2 id="saldoUsdt" style="color: #0ecb81;">$ 9.01 USDT</h2>
    </div>

    <div class="card">
        <h3>Cotação de Mercado em Tempo Real (XRPUSDT)</h3>
        <h2 id="currentPrice" style="color: #f0b90b;">$ --</h2>
    </div>

    <div class="card">
        <h3>Registo de Atividade Autónoma</h3>
        <div id="tradeLog" class="trade-log">A iniciar conexão com o mercado...</div>
    </div>

    <script>
        let ordemDisparada = false;

        async function atualizarPainel() {
            try {
                const res = await fetch(`https://api.binance.com/api/v3/ticker/price?symbol=XRPUSDT`);
                const data = await res.json();
                if (data && data.price) {
                    document.getElementById('currentPrice').innerText = `$ ${parseFloat(data.price).toFixed(4)}`;
                }

                if (!ordemDisparada) {
                    ordemDisparada = true;
                    executarOrdemAutomatica();
                }
            } catch (e) {
                console.error(e);
            }
        }

        async function executarOrdemAutomatica() {
            const logBox = document.getElementById('tradeLog');
            const time = new Date().toLocaleTimeString();
            logBox.innerText = `[${time}] 🚀 A disparar ordem automática de 6 XRP para a Bybit...\n` + logBox.innerText;

            try {
                const res = await fetch('/place-order-proxy', { method: 'POST' });
                const data = await res.json();

                if (data.success && data.result?.retCode === 0) {
                    logBox.innerText = `[${time}] ✅ ORDEM EXECUTADA COM SUCESSO! ID: ${data.result.result.orderId}\n` + logBox.innerText;
                } else {
                    const msg = data.error?.retMsg || JSON.stringify(data.error) || "Erro desconhecido";
                    logBox.innerText = `[${time}] ⚠️ Resposta da Bybit: ${msg}\n` + logBox.innerText;
                }
            } catch (err) {
                logBox.innerText = `[${time}] ❌ Erro: ${err.message}\n` + logBox.innerText;
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            atualizarPainel();
            setInterval(atualizarPainel, 4000);
        });
    </script>

</body>
</html>
